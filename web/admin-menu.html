<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management | Smart Canteen Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="emoji">🍴</span> Smart Canteen</div>
      <nav>
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-orders.html">🧾 Orders</a>
        <a href="admin-menu.html" class="active">🍔 Menu Management</a>
        <a href="admin-categories.html">🗂️ Categories</a>
        <a href="admin-payment.html">💳 Payment QR Code</a>
      </nav>
      <div class="sidebar-logout">
        <button class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn">☰</button>
          <h1>Menu Management</h1>
        </div>
        <button class="btn btn-primary" onclick="openAddItemModal()">+ Add Food Item</button>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Availability</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="menu-items-body">
            <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Food Item Modal -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal-box">
      <h3 id="item-modal-title">Add Food Item</h3>
      <form id="item-form" onsubmit="submitItemForm(event)">
        <div class="form-group">
          <label for="item-name">Food Name</label>
          <input type="text" id="item-name" required>
        </div>
        <div class="admin-form-row">
          <div class="form-group">
            <label for="item-price">Price (₹)</label>
            <input type="number" id="item-price" min="1" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category" required></select>
          </div>
        </div>
        <div class="form-group">
          <label for="item-image">Food Image (optional)</label>
          <input type="file" id="item-image" accept="image/*">
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="item-available" checked>
          Available
        </label>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeItemModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="item-submit-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>
    requireAdminLogin();
    document.addEventListener("DOMContentLoaded", loadMenuManagementPage);
  </script>
</body>
</html>
