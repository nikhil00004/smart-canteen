<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment QR Code | Smart Canteen Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="emoji">🍴</span> Smart Canteen</div>
      <nav>
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-orders.html">🧾 Orders</a>
        <a href="admin-menu.html">🍔 Menu Management</a>
        <a href="admin-categories.html">🗂️ Categories</a>
        <a href="admin-payment.html" class="active">💳 Payment QR Code</a>
      </nav>
      <div class="sidebar-logout">
        <button class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn">☰</button>
          <h1>Payment QR Code</h1>
        </div>
      </div>

      <div class="panel" style="max-width:480px;">
        <h3>Current Active QR Code</h3>
        <div id="current-qr-box" style="text-align:center;">
          <div class="state-box"><div class="spinner"></div><p>Loading...</p></div>
        </div>
      </div>

      <div class="panel" style="max-width:480px;">
        <h3>Upload New QR Code</h3>
        <p style="color:#6b7280; font-size:0.85rem; margin-bottom:16px;">
          Uploading a new image will replace the current active QR code shown to customers on checkout.
        </p>
        <form id="qr-upload-form">
          <div class="form-group">
            <input type="file" id="qr-file-input" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="qr-upload-btn">Upload / Replace QR Code</button>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/payment.js"></script>
  <script>
    requireAdminLogin();
  </script>
</body>
</html>
