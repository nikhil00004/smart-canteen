<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Smart Canteen Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="emoji">🍴</span> Smart Canteen</div>
      <nav>
        <a href="admin-dashboard.html">📊 Dashboard</a>
        <a href="admin-orders.html">🧾 Orders</a>
        <a href="admin-menu.html">🍔 Menu Management</a>
        <a href="admin-categories.html" class="active">🗂️ Categories</a>
        <a href="admin-payment.html">💳 Payment QR Code</a>
      </nav>
      <div class="sidebar-logout">
        <button class="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn">☰</button>
          <h1>Categories</h1>
        </div>
        <button class="btn btn-primary" onclick="openAddCategoryModal()">+ Add Category</button>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-body">
            <tr><td colspan="3" style="text-align:center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal-box">
      <h3 id="category-modal-title">Add Category</h3>
      <form id="category-form" onsubmit="submitCategoryForm(event)">
        <div class="form-group">
          <label for="category-name">Category Name</label>
          <input type="text" id="category-name" placeholder="e.g. Chinese Food" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeCategoryModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="category-submit-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/categories.js"></script>
  <script>
    requireAdminLogin();
  </script>
</body>
</html>
