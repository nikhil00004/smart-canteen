<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Smart Canteen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-login-page">
    <div class="login-card">
      <div class="logo">Smart Canteen</div>
      <p>Admin Panel Login</p>
      

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-username">Username</label>
          <input type="text" id="admin-username" class="admin-inp" placeholder="   admin" required>
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" class="admin-inp" placeholder="    ••••••••" required>
        </div>
        <div class="field-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>

      <p style="margin-top:18px; font-size:0.8rem;">Default: admin / admin123</p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
